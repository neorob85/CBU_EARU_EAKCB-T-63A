; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The project path contains parentheses (SeaDrive mount), which break the
; unquoted board.json argument in libretiny's link2bin command. Building
; outside that path avoids the shell syntax error at link time.
[platformio]
build_dir = ~/.pio-build/${PROJECT_HASH}

[env:cbu]
platform = libretiny
board = cbu
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-526F0021151
upload_speed = 115200
monitor_port = /dev/cu.usbserial-526F0021151
extra_scripts = pre:extra/load_env.py
build_flags =
	-D LT_UART_DEFAULT_PORT=2 ;mettere 1 per Serial1
	; Levels: TRACE=0 DEBUG=1 INFO=2 WARN=3 ERROR=4 FATAL=5. A message is kept
	; when LT_LEVEL_x >= LT_LOGLEVEL, so 5 prints almost nothing and 0 prints
	; everything. 2 = INFO gives the WiFi driver messages without flooding the
	; 4800 baud link. Restore to 4 or 5 when done debugging.
	-D LT_LOGLEVEL=5
lib_deps =
	neorob85/PrefsManager@^1.0.0
	neorob85/ESPOTADASH@^1.2.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2
	neorob85/NTC@1.0.0
	neorob85/HAmqttSTR@^1.1.1

[env:cbu-ota]
platform = libretiny
board = cbu
framework = arduino
upload_protocol = custom
upload_port = 192.168.1.250
upload_command = curl -s -X POST http://${UPLOAD_PORT}/update -F "firmware=@${SOURCE}"
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:extra/load_env.py
build_flags =
	-D LT_UART_DEFAULT_PORT=2
	-D LT_LOGLEVEL=5
lib_deps =
	neorob85/PrefsManager@^1.0.0
	neorob85/ESPOTADASH@^1.2.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2
	neorob85/NTC@1.0.0
	neorob85/HAmqttSTR@^1.1.1

; OTA tramite l'AP di provisioning (dispositivo non configurato, IP 10.0.0.1)
[env:cbu-ota-prov]
platform = libretiny
board = cbu
framework = arduino
upload_protocol = custom
upload_port = 10.0.0.1
upload_command = curl -s -X POST http://${UPLOAD_PORT}/update -F "firmware=@${SOURCE}"
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:extra/load_env.py
build_flags =
	-D LT_UART_DEFAULT_PORT=2
	-D LT_LOGLEVEL=5
lib_deps =
	neorob85/PrefsManager@^1.0.0
	neorob85/ESPOTADASH@^1.2.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2
	neorob85/NTC@1.0.0
	neorob85/HAmqttSTR@^1.1.1
